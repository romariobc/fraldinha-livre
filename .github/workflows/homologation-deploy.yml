name: Deploy isolated homologation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish isolated backend and apply QA D1 migrations
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-homologation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.confirm }}
    uses: ./.github/workflows/validation.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: homologation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Publish isolated backend and D1
        run: node scripts/deploy-homologation.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: homologation-deployment
          path: qa-evidence/deployment.json
          if-no-files-found: error
