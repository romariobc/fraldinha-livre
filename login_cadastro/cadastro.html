<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Xixi Barato</title>
    <meta content="Cadastre-se no Xixi Barato e comece a economizar nas fraldas do seu bebê." name="description">

    <!-- Favicons -->
    <link href="../assets/img/favicon.png" rel="icon">
    <link href="../assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Raleway:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="../assets/vendor/aos/aos.css" rel="stylesheet">
    <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
    <link href="../assets/vendor/remixicon/remixicon.css" rel="stylesheet">

    <!-- Template Main CSS File -->
    <link href="../assets/css/style.css" rel="stylesheet">

    <style>
        .cadastro-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 100px;
            padding-bottom: 50px;
        }
        .cadastro-form {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
        }
        .cadastro-form h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
            font-weight: 700;
        }
        .cadastro-form .form-control {
            padding: 12px 15px;
            border-radius: 5px;
        }
        .cadastro-form .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }
        .cadastro-form .btn-primary {
            background: #3498db;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
        }
        .cadastro-form .btn-primary:hover {
            background: #2383c4;
        }
        .cadastro-form .btn-link {
            color: #3498db;
        }
    </style>
</head>
<body>
    <!-- ======= Header ======= -->
    <header id="header" class="fixed-top d-flex align-items-center">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="logo">
                <h1><a href="../index.html">Xixi Barato</a></h1>
            </div>
            <nav id="navbar" class="navbar">
                <ul>
                    <li><a class="nav-link" href="../index.html">Início</a></li>
                    <li><a class="nav-link" href="../index.html#about">Sobre nós</a></li>
                    <li><a class="nav-link" href="../index.html#contact">Contato</a></li>
                    <li><a class="nav-link active" href="cadastro.html">Cadastrar</a></li>
                    <li><a class="getstarted" href="login.html">Entrar</a></li>
                </ul>
                <i class="bi bi-list mobile-nav-toggle"></i>
            </nav>
        </div>
    </header>

    <main id="main">
        <section class="cadastro-section">
            <div class="container">
                <div class="cadastro-form" data-aos="fade-up">
                    <h2><i class="bi bi-person-plus"></i> Criar Conta</h2>
                    <form>
                        <div class="row">
                            <div class="col-12 mb-3">
                                <label for="nomeCompleto" class="form-label">Nome Completo</label>
                                <input type="text" class="form-control" id="nomeCompleto" placeholder="Digite seu nome completo" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input type="tel" class="form-control" id="telefone" placeholder="(11) 99999-9999" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cpf" class="form-label">CPF</label>
                                <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cep" class="form-label">CEP</label>
                                <input type="text" class="form-control" id="cep" placeholder="00000-000" required>
                            </div>
                            <div class="col-12 mb-3">
                                <label for="endereco" class="form-label">Endereço</label>
                                <input type="text" class="form-control" id="endereco" placeholder="Rua, número, complemento" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="bairro" class="form-label">Bairro</label>
                                <input type="text" class="form-control" id="bairro" placeholder="Bairro" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cidade" class="form-label">Cidade</label>
                                <input type="text" class="form-control" id="cidade" placeholder="Cidade" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" placeholder="Mínimo 8 caracteres" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="confirmarSenha" class="form-label">Confirmar Senha</label>
                                <input type="password" class="form-control" id="confirmarSenha" placeholder="Repita a senha" required>
                            </div>
                            <div class="col-12 mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="termos" required>
                                    <label class="form-check-label" for="termos">
                                        Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>
                                    </label>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">Criar Conta</button>
                            </div>
                        </div>
                        <hr>
                        <div class="text-center">
                            <p class="mb-2">Já tem uma conta?</p>
                            <a href="login.html" class="btn btn-outline-primary" style="border-radius: 50px;">Fazer Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- ======= Footer ======= -->
    <footer id="footer">
        <div class="container">
            <div class="row d-flex align-items-center">
                <div class="col-lg-6 text-center text-lg-start">
                    <p class="mb-0">&copy; 2024 Xixi Barato. Todos os direitos reservados.</p>
                </div>
                <div class="col-lg-6">
                    <nav class="footer-links text-lg-end text-center pt-2 pt-lg-0">
                        <a href="../index.html">Início</a>
                        <a href="../index.html#about">Sobre</a>
                        <a href="../index.html#contact">Contato</a>
                    </nav>
                </div>
            </div>
        </div>
    </footer>

    <!-- Vendor JS Files -->
    <script src="../assets/vendor/aos/aos.js"></script>
    <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Template Main JS File -->
    <script src="../assets/js/main.js"></script>
</body>
</html>
